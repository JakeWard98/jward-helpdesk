name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Tests
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (runs tsc)
        working-directory: frontend
        run: npm run build

  compose:
    name: Compose stack validates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate with placeholder values
        run: |
          # Placeholders only - real secrets never live in CI for this repo.
          sed -e 's/CHANGE_ME[A-Za-z_0-9]*/ci-placeholder-value/g' \
              .env.example > .env.ci
          docker compose --env-file .env.ci config -q
